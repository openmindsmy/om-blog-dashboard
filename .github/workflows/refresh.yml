name: Daily dashboard refresh

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC = 11:00 Kuala Lumpur, daily
  workflow_dispatch: {}    # allows manual "Run workflow" from the Actions tab

permissions:
  contents: write

concurrency:
  group: dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests google-auth

      - name: Refresh dashboard data
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SEMRUSH_API_KEY: ${{ secrets.SEMRUSH_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/refresh.py

      - name: Commit and push
        run: |
          git config user.name "om-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily refresh $(TZ=Asia/Kuala_Lumpur date +'%d %b %Y')"
            git push
          fi
